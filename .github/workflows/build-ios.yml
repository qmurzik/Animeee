name: Build iOS
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -project AnimeApp.xcodeproj -scheme AnimeApp -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CURRENT_PROJECT_VERSION=${{ github.run_number }} CODE_SIGNING_ALLOWED=NO build
      - name: Package and validate
        run: |
          set -euxo pipefail
          APP=build/Build/Products/Release-iphoneos/AnimeApp.app
          test -f "$APP/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")" = 18.0
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          lipo "$APP/AnimeApp" -verify_arch arm64
          otool -l "$APP/AnimeApp" | grep -q '@executable_path/Frameworks'
          test -f "$APP/Frameworks/MobileVLCKit.framework/MobileVLCKit"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry AnimeApp-unsigned.ipa Payload
          unzip -t AnimeApp-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: AnimeApp-unsigned
          path: AnimeApp-unsigned.ipa
      - name: Publish unsigned prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" AnimeApp-unsigned.ipa --clobber
          else
            gh release create "$tag" AnimeApp-unsigned.ipa Licenses/VLCKit-LGPL-2.1.txt THIRD_PARTY.md --target "${{ github.sha }}" --prerelease --title "AnimeApp build ${{ github.run_number }}" --notes "Unsigned iOS 18 ARM64 build. AniLibria uses AVPlayer; Aksor DASH and CVH MP4 use VLCKit. Physical iPhone playback remains unverified."
          fi
  simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Pick an iPhone simulator
        run: |
          python3 - <<'PY'
          import json, subprocess, os
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          candidates = [d for runtime, group in devices.items() if 'iOS' in runtime for d in group if 'iPhone' in d['name']]
          selected = next((d for d in candidates if d['name'] == 'iPhone 16'), candidates[0])
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('SIMULATOR_ID=' + selected['udid'] + '\n')
          PY
      - name: Build and launch on simulator
        run: |
          xcodebuild -project AnimeApp.xcodeproj -scheme AnimeApp -configuration Debug -sdk iphonesimulator -destination "id=$SIMULATOR_ID" -derivedDataPath simbuild ARCHS=arm64 ONLY_ACTIVE_ARCH=YES SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG CODE_SIGNING_ALLOWED=NO build
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl ui "$SIMULATOR_ID" appearance dark
          codesign --force --deep --sign - simbuild/Build/Products/Debug-iphonesimulator/AnimeApp.app
          xcrun simctl install "$SIMULATOR_ID" simbuild/Build/Products/Debug-iphonesimulator/AnimeApp.app
          launched=0
          for attempt in 1 2 3; do
            if xcrun simctl launch "$SIMULATOR_ID" com.animeapp.viewer; then launched=1; break; fi
            sleep 10
          done
          test "$launched" = 1
          sleep 15
          xcrun simctl io "$SIMULATOR_ID" screenshot home.png
      - name: Check native video output on simulator
        run: |
          for source in aksor cvh; do
            SIMCTL_CHILD_ANIMEAPP_PROBE="$source" xcrun simctl launch --terminate-running-process "$SIMULATOR_ID" com.animeapp.viewer
            detected=0
            for attempt in 1 2 3 4; do
              sleep 15
              xcrun simctl spawn "$SIMULATOR_ID" log show --last 5m --style compact --predicate "eventMessage CONTAINS 'ANIMEAPP_FRAME_$source'" > "probe-$source.log"
              if grep -q "ANIMEAPP_FRAME_$source seconds=" "probe-$source.log"; then detected=1; break; fi
            done
            xcrun simctl io "$SIMULATOR_ID" screenshot "player-$source.png"
            cat "probe-$source.log"
            test "$detected" = 1
          done
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-home
          path: |
            home.png
            player-*.png
            probe-*.log
      - name: Collect simulator diagnostics
        if: failure()
        run: |
          mkdir -p diagnostics
          xcrun simctl spawn "$SIMULATOR_ID" log show --last 5m --style compact --predicate 'process == "AnimeApp"' > diagnostics/app.log 2>&1 || true
          find "$HOME/Library/Logs/DiagnosticReports" "$HOME/Library/Developer/CoreSimulator/Devices/$SIMULATOR_ID/data/Library/Logs" -name '*AnimeApp*' -exec cp {} diagnostics/ \; 2>/dev/null || true
          tail -150 diagnostics/app.log
          for report in diagnostics/*.ips; do test -f "$report" && head -120 "$report"; done
          true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: simulator-diagnostics
          path: diagnostics
      - name: Attach simulator result to release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          for attempt in 1 2 3; do gh release view "$tag" >/dev/null 2>&1 && break; sleep 10; done
          for artifact in home.png player-*.png probe-*.log; do
            if test -f "$artifact"; then gh release upload "$tag" "$artifact" --clobber; fi
          done
          if test -d diagnostics; then tar -czf simulator-diagnostics.tgz diagnostics; gh release upload "$tag" simulator-diagnostics.tgz --clobber; fi
