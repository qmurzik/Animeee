name: Build iOS
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -project AnimeApp.xcodeproj -scheme AnimeApp -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package and validate
        run: |
          set -euxo pipefail
          APP=build/Build/Products/Release-iphoneos/AnimeApp.app
          test -f "$APP/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")" = 18.0
          lipo "$APP/AnimeApp" -verify_arch arm64
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry AnimeApp-unsigned.ipa Payload
          unzip -t AnimeApp-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: AnimeApp-unsigned
          path: AnimeApp-unsigned.ipa
      - name: Publish unsigned prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" AnimeApp-unsigned.ipa --clobber
          else
            gh release create "$tag" AnimeApp-unsigned.ipa --target "${{ github.sha }}" --prerelease --title "AnimeApp build ${{ github.run_number }}" --notes "Unsigned iOS 18 ARM64 build. AniLibria uses AVPlayer; Aksor DASH and CVH MP4 use VLCKit. Physical iPhone playback remains unverified."
          fi
  simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Pick an iPhone simulator
        run: |
          python3 - <<'PY'
          import json, subprocess, os
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          candidates = [d for runtime, group in devices.items() if 'iOS' in runtime for d in group if 'iPhone' in d['name']]
          selected = next((d for d in candidates if d['name'] == 'iPhone 16'), candidates[0])
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('SIMULATOR_ID=' + selected['udid'] + '\n')
          PY
      - name: Build and launch on simulator
        run: |
          xcodebuild -project AnimeApp.xcodeproj -scheme AnimeApp -configuration Debug -sdk iphonesimulator -destination "id=$SIMULATOR_ID" -derivedDataPath simbuild CODE_SIGNING_ALLOWED=NO build
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl ui "$SIMULATOR_ID" appearance dark
          xcrun simctl install "$SIMULATOR_ID" simbuild/Build/Products/Debug-iphonesimulator/AnimeApp.app
          xcrun simctl launch "$SIMULATOR_ID" com.animeapp.viewer
          sleep 15
          xcrun simctl io "$SIMULATOR_ID" screenshot home.png
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-home
          path: home.png
