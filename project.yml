name: AnimeApp
options:
  deploymentTarget:
    iOS: '18.0'
packages:
  VLCKit:
    url: https://github.com/tylerjonesio/vlckit-spm
    exactVersion: 3.6.0
targets:
  AnimeApp:
    type: application
    platform: iOS
    sources: [AnimeApp]
    dependencies:
      - package: VLCKit
        product: VLCKitSPM
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.7.0
        CURRENT_PROJECT_VERSION: 1
        PRODUCT_BUNDLE_IDENTIFIER: com.animeapp.viewer
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        SWIFT_VERSION: '5.0'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: AnimeApp/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: AnimeApp
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: '1'
        IPHONEOS_DEPLOYMENT_TARGET: '18.0'

  AnimeAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: AnimeApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.animeapp.viewer.UITests
        TEST_TARGET_NAME: AnimeApp
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5.0'
schemes:
  AnimeAppUITests:
    build:
      targets:
        AnimeApp: all
        AnimeAppUITests: [test]
    test:
      targets: [AnimeAppUITests]
